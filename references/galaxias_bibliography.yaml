- id: smith2026BattlePredatorsImpact
  abstract: "ABSTRACT\n            \n              \n                \n                  Biological invasions are recognised as one of the greatest threats to the persistence of freshwater fish communities. More than 500 introduced freshwater fish species are now established worldwide, yet their ecosystem‐level impacts remain poorly quantified in many regions. The Mount Lofty Ranges represent a particularly important system for evaluating these impacts as they support several native fish species of conservation concern alongside established populations of trout and redfin perch.\n                \n                \n                  \n                    Data from 1338 sampling events, across 356 sites, collected over a 23‐year period to assess the effects of introduced\n                    \n                      Salmo trutta\n                    \n                    (brown trout),\n                    \n                      Oncorhynchus mykiss\n                    \n                \
    \    (rainbow trout) and\n                    \n                      Perca fluviatilis\n                    \n                    (redfin perch) on native fish populations in the Mount Lofty Ranges, South Australia.\n                  \n                \n                \n                  \n                    Strong and significant reductions in native species abundance and diversity were observed at sites where trout occurred, whereas redfin perch appeared to primarily affect exotic species abundance. Network analyses revealed a pronounced predatory effect associated with brown trout, including the potential for strong competitive interactions with redfin perch. Brown trout negatively affected four native species,\n                    Pseudaphiritis urvillii\n                    (congolli),\n                    \n                      Galaxias maculatus\n                    \n                    (common galaxias),\n                    \n                      Galaxias olidus\n   \
    \                 \n                    (mountain galaxias) and\n                    \n                      Nannoperca australis\n                    \n                    (southern pygmy perch), all currently at risk of extinction.\n                  \n                \n                \n                  Centrality analyses further identified the predatory impact of brown trout and redfin perch in the Mount Lofty Ranges, whereby a fundamental shift in fish community structure has occurred, with restructured trophic interactions and energy flow across the community.\n                \n                \n                  Collectively, our findings suggest that invasive predators can differentially restructure freshwater fish communities. Furthermore, management actions targeting redfin perch in isolation may unintentionally intensify declines in native fish by releasing competitive or predatory pressures from trout species. Effective management of freshwater invasions therefore requires\
    \ an ecosystem‐based approach that accounts for interactions among multiple invasive species."
