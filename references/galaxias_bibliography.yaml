- id: mccrea2024InferringSpeciesExtinctiona
  abstract: "Abstract\n            \n              \n                \n                  1.\n                  Understanding whether a species still persists, or the timing of its extinction is challenging, however, such knowledge is fundamental for effective species management.\n                \n                \n                  2.\n                  For the vast majority of species our understanding of their existence is based solely on sighting data that can range from museum specimens and clear photographs, through vocalisations, to markings and oral accounts.\n                \n                \n                  3.\n                  Here we review the methods that have been developed to infer the extinction of species from a sighting record, providing an understanding of their assumptions and applications. We have also produced an RShiny package which can be used to implement some of the methods presented in the article.\n                \n                \n                  4.\n\
    \                  While there are a number of potential areas that could be further developed, the methods reviewed provide a useful tool for inferring species extinction."
