- id: adams2023MultigeneInsightsTaxonomy
  abstract: "Context\n              Galaxiids are a widespread, southern hemisphere, radiation of mostly obligate freshwater fishes. Tasmania houses a diversity of endemic species of Galaxias and Paragalaxias. Of these, many are at risk of extinction, being landlocked, range-restricted and subject to anthropogenic threats, placing a high-conservation priority on the region.\n            \n            \n              Aim\n              Our aim was to synthesise historic and published molecular datasets to provide the sound systematic framework needed to underpin future conservation and taxonomic efforts for Tasmanian galaxiids.\n            \n            \n              Methods\n              Novel and published nuclear (allozyme) and matrilineal (cytb) datasets were generated and integrated for every putative Tasmanian galaxiid species lacking a comparable multi-gene assessment.\n            \n            \n              Key results\n              The Tasmanian galaxiids are phylogenetically\
    \ diverse, with molecular data generally supporting the accepted taxonomy, but with potential species-level diversity noted within an alpine radiation of the Galaxias truttaceus complex and further support for synonymy of G. niger within G. brevipinnis.\n            \n            \n              Conclusions\n              This study highlights the value of multi-locus studies in both validating species-level taxonomy and resolving taxonomic ambiguities and conservation priorities within Tasmania’s galaxiids.\n            \n            \n              Implications\n              Our integrated genetic analyses provide a framework to underpin more in-depth genomic approaches to assess additional cryptic diversity and conservation planning, such as genetic rescue and ex situ population security."
