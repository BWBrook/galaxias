- id: andrews1976RevisionFamilyGalaxiidae
  abstract: "Nine species of the genus Galaxias and one species of the genus Paragalaxias are found to be represented in Tasmania. The taxonomy, meristic and morphometric variation of each species is examined and data on the distribution, life history and ecology are presented together with references and synonymy. At the commencement of the present study previous works credited a total of 16 species in four genera to Tasmania distributed as follows: Galaxias, 12 species, Paragalaxias, 1 species, Saxilaga, 2 species and Brachygalaxias, 2 subspecies.\n            In the present study G. scopus Scott is shown to be a synonym of G. truttaceus Valenciennes, G. affinis Regan and G. coxii Macleay are shown to be synonyms of G. brevipinnis Gunther which is recorded for the first time from the Australian mainland. The two species currently referred to the genus Saxilaga, S. cleaveri Scott and S. anguilliformis Scott, together with G. upcheri Scott are found to represent one species of Galaxias.\
    \ The type locality of G. auratus Johnston is shown to be Lake Sorell and the type locality of G. upcheri is more accurately defined than in previous works. The two subspecies of Brachygalaxias, B. pusillus tasmaniensis Scott and B. pusillus flindersiensis Scott, are treated as one species of Galaxias.\n            The Tasmanian galaxiid fauna is compared and contrasted with the galaxiid faunas of mainland Australia and New Zealand and the distribution patterns and zoogeographic considerations are discussed."
