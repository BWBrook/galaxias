- id: boakes2015InferringSpeciesExtinction
  abstract: "Summary\n            \n              \n                \n                  Accurate measures of extinction are needed in biodiversity monitoring and conservation management, but ascertaining the exact time at which a species became extinct is difficult since a small population may go undetected for many years.\n                \n                \n                  For little‐studied species, often the only information available is historical sighting data. Several statistical tests have been developed which use this information to make inferences about a species’ extinction. The increasing array of methods can present a daunting choice.\n                \n                \n                  We review the more frequently cited methods, for each model explaining its assumptions, the data required, the scenarios it was developed for and power considerations, if known. We provide guidance on selecting the most appropriate method for a particular sighting record.\n              \
    \  \n                \n                  We give examples from the literature to show how the methods have been usefully applied across conservation research, informing conservation decision‐making and extinction inference."
