- id: brown2022ChoosingOptimalTrigger
  abstract: "Many endangered species exist in only a single population, and almost all species that go extinct will do so from their last remaining population. Understanding how to best conserve these single population threatened species (SPTS) is therefore a distinct and important task for threatened species conservation science. As a last resort, managers of SPTS may consider taking the entire population into captivity–\n              ex situ\n              ,\n              in toto\n              conservation. In the past, this choice has been taken to the great benefit of the SPTS, but it has also lead to catastrophe. Here, we develop a decision-support tool for planning when to trigger this difficult action. Our method considers the uncertain and ongoing decline of the SPTS, the possibility that drastic\n              ex situ\n              action will fail, and the opportunities offered by delaying the decision. Specifically, these benefits are additional time for ongoing\n        \
    \      in situ\n              actions to succeed, and opportunities for the managers to learn about the system. To illustrate its utility, we apply the decision tool to four retrospective case-studies of declining SPTS. As well as offering support to this particular decision, our tool illustrates why trigger points for difficult conservation decisions should be formulated in advance, but must also be adaptive. A trigger-point for the\n              ex situ\n              ,\n              in toto\n              conservation of a SPTS, for example, will not take the form of a simple threshold abundance."
