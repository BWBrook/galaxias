- id: chilcott2013ExtinctHabitatExtant
  abstract: The Pedder galaxias (Galaxias pedderensis) from Lake Pedder, Tasmania, Australia, is one of the world’s most threatened freshwater fish. The flooding of Lake Pedder in 1972 for hydroelectric power generation caused a major change to the ecosystem that initiated an irreversible decline in the Pedder galaxias within its natural range. The flooding inundated another headwater catchment and native and introduced fish from this catchment colonised the impoundment. Numbers of the Pedder galaxias declined markedly as the impoundment matured and as colonising fish proliferated. Surveys in the 1980s confirmed the parlous state of the population, highlighting the need for conservation intervention. Several urgent conservation actions were undertaken to save the species from extinction. Translocation was considered the most important recovery action, given the critically low numbers in the wild. The species is now extinct from its natural range and is known from only two translocated populations.
    The conservation program, and specifically the translocation recovery action, saved the Pedder galaxias from extinction. The conservation management was extremely challenging since rapidly declining fish numbers needed timely and critical decisions to underpin the future of the fish. Recommendations are provided arising from this case study to guide conservation of freshwater fish in similar circumstances.
