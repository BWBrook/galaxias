- id: waters2023FishBiogeographyHybridization
  abstract: "Abstract\n            Freshwater ecosystems frequently house diverse assemblages of closely related fish taxa, which can be particularly prone to hybridization and introgression. While extensive introgression may be expected among biogeographically proximate lineages, recent analyses imply that contemporary distributions do not always accurately predict hybridization history. Here, we use the ABBA–BABA approach to test biogeographic hypotheses regarding the extent of hybridization in the recent evolution of New Zealand’s species-rich freshwater Galaxias vulgaris fish complex. Genome-wide comparisons reveal significant increases in introgression associated with increasing geographic overlap of taxa. The estimator DP, which assesses the net proportion of a genome originating from introgression, shows a particularly strong relationship with biogeographic overlap (R2 = .43; p = .005). Our analyses nevertheless reveal surprisingly substantial signatures of introgression among taxa\
    \ that currently have disjunct distributions within drainages (e.g., separate subcatchments). These “anomalies” imply that current biogeography is not always an accurate predictor of introgression history. Our study suggests that both modern and ancient biogeographic shifts, including recent anthropogenic range fragmentation and tectonically driven riven capture events, have influenced introgression histories in this dynamic freshwater fish radiation."
