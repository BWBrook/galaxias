- id: glova1993FurtherAssessmentTrophic
  abstract: "Abstract\n            \n              The trophic and spatial inter‐relations between 2 small native fish (\n              Galaxias vulgaris\n              Stokell and\n              G. paucispondylus\n              Stokell, Galaxiidae) and juveniles of 2 introduced fish (\n              Oncorhynchus tshawytscha\n              Walbaum and\n              Salmo trutta\n              L., Salmonidae) were investigated in a New Zealand stream. Interspecific overlap in timing of feeding among these four fish species was greatest between pre‐dusk and pre‐dawn (1730‐0530). Aquatic invertebrates were consumed exclusively by all fish species except\n              O. tshawytscha\n              , which also preyed on Trichoptera imagos, particularly at night. Dietary similarities were least between galaxiids, moderate between galaxiids and salmonids, and greatest between salmonid species. Both galaxiid species were found primarily in riffles, with\n              G. vulgaris\n          \
    \    occupying slightly deeper (≤0.3 m) and slower (0.5–0.8 m. s\n              −1\n              ) waters than did\n              G. paucispondylus\n              (≤0.2 m deep and 0.7‐1.0 m. s\n              −1\n              water velocity); salmonids were mostly in pools and runs, with\n              O. tshawytscha\n              occupying slightly slower (0.1‐0.2 m. s\n              −1\n              ) and deeper (≤0.5 m) waters than those occupied by\n              S. trutta\n              (0.2–0.5 m. s\n              −1\n              water velocity and ≤0.4 m deep). The interspecific differences in feeding and microdistribution presumably reduce interaction between sympatric populations of galaxiids and salmonids."
