- id: mcgowan2017IUCNGuidelinesDetermining
  abstract: "Abstract\n            The Convention on Biological Diversity's target of halting extinctions by 2020 is less than a handful of years away. Captive, or ex situ, management has long been cited as having a potential role to play in the recovery of species, although this remains the subject of debate. IUCN's Species Survival Commission (IUCN SSC) produced guidelines to assist in identifying when ex situ management may contribute to species recovery in 2002. Since then, there have been considerable developments in a range of areas that may influence the design of such programs (e.g., understanding of constraints on breeding programs, development of new techniques and approaches, and strategic planning approaches to species conservation). IUCN SSC has therefore revised its guidance and proposes a five‐step process: (1) compile a status review; (2) define the role(s) that ex situ management might play; (3) determine the precise nature of the ex situ population in order to meet identified\
    \ role(s); (4) define resources and expertise, and appraise the feasibility and risks; and (5) make a decision that is informed based on the above analysis and transparent. These guidelines offer an objective process for considering the role of ex situ management in species conservation."
