- id: goldberg2016CriticalConsiderationsApplication
  abstract: "Summary\n            \n              \n                \n                  \n                    Species detection using environmental\n                    DNA\n                    (\n                    eDNA\n                    ) has tremendous potential for contributing to the understanding of the ecology and conservation of aquatic species. Detecting species using\n                    eDNA\n                    methods, rather than directly sampling the organisms, can reduce impacts on sensitive species and increase the power of field surveys for rare and elusive species. The sensitivity of\n                    eDNA\n                    methods, however, requires a heightened awareness and attention to quality assurance and quality control protocols. Additionally, the interpretation of\n                    eDNA\n                    data demands careful consideration of multiple factors. As\n                    eDNA\n                    methods have grown in application, diverse\
    \ approaches have been implemented to address these issues. With interest in\n                    eDNA\n                    continuing to expand, supportive guidelines for undertaking\n                    eDNA\n                    studies are greatly needed.\n                  \n                \n                \n                  \n                    Environmental\n                    DNA\n                    researchers from around the world have collaborated to produce this set of guidelines and considerations for implementing\n                    eDNA\n                    methods to detect aquatic macroorganisms.\n                  \n                \n                \n                  \n                    Critical considerations for study design include preventing contamination in the field and the laboratory, choosing appropriate sample analysis methods, validating assays, testing for sample inhibition and following minimum reporting guidelines. Critical considerations for\
    \ inference include temporal and spatial processes, limits of correlation of\n                    eDNA\n                    with abundance, uncertainty of positive and negative results, and potential sources of allochthonous\n                    DNA\n                    .\n                  \n                \n                \n                  We present a synthesis of knowledge at this stage for application of this new and powerful detection method."
