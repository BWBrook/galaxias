- id: smart2016AssessingCostefficiencyEnvironmental
  abstract: "Summary\n            \n              \n                \n                  \n                    Environmental\n                    DNA\n                    (\n                    eDNA\n                    ) sampling can be a highly sensitive method for detecting aquatic taxa; however, the cost‐efficiency of this technique relative to traditional methods has not been rigorously assessed.\n                  \n                \n                \n                  \n                    We show how methods that account for imperfect and stochastic detection can be used to (i) determine the optimal allocation of survey effort with\n                    eDNA\n                    sampling for a fixed budget (i.e. identify the optimal combination of water samples vs. site visits), and (ii) assess the cost‐efficiency of\n                    eDNA\n                    sampling relative to traditional survey techniques. We illustrate this approach by comparing\n                    eDNA\n\
    \                    sampling and bottle‐trapping for an exotic newt species (\n                    Lissotriton v. vulgaris\n                    ) recently detected in Melbourne, Australia.\n                  \n                \n                \n                  \n                    Bottle traps produced much lower detection rates than\n                    eDNA\n                    sampling, but the cost‐efficiency of the two methods can be similar because bottle‐trapping is cheaper per sample. The relative cost‐efficiency of the two sampling methods was sensitive to the available survey budget, the costs of\n                    eDNA\n                    primer/probe development and sample processing and the number of positive quantitative\n                    PCR\n                    assays (\n                    qPCR\n                    s) used to designate a water sample as positive for newt\n                    DNA\n                    . Environmental\n                    DNA\n\
    \                    sampling was more cost‐efficient than bottle‐trapping for small to intermediate budgets when primer/probe development and sample processing costs were low, and 1/4 or 2/4 positive\n                    qPCR\n                    s were used to label a water sample as positive for newt\n                    eDNA\n                    . However, bottle traps were generally more cost‐efficient than\n                    eDNA\n                    sampling when primer/probe development and sample processing costs were high, regardless of\n                    qPCR\n                    threshold or survey budget.\n                  \n                \n                \n                  \n                    Traditional sampling methods may achieve lower detection probabilities compared to\n                    eDNA\n                    sampling, but the totality of costs can make\n                    eDNA\n                    sampling less efficient than traditional techniques\
    \ in some circumstances. Our approach provides a quantitative framework for determining how many water samples and site visits are required to maximize detection probabilities with\n                    eDNA\n                    sampling, and can calculate the cost‐efficiency of any sampling method."
